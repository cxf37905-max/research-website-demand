interface:
  display_name: "网站需求与产品机会调研"
  short_description: "全量研究用户证据，并逐产品深挖细分人群、营销链路、痛点覆盖与机会。"
  default_prompt: "Use $research-website-demand to 仅通过不启动浏览器的公开访问方式调研这个网站：把用户材料分为完整讨论证据、只能证明个人经历的范围有限证据和仅供发现的受限线索，确保结论范围不超过实际读取范围；需求用户原话至少收集50条，涉及多个核心群体、市场或任务时默认至少100条；先分类列出全部直链、调研总结和研究观点，不展示用户原话；再为每个实质不同且证据充分的用户群体写第三人称贴身视角的沉浸故事，让场景、情绪、内心冲突、利益、代价和底层需求从连续事件中自然显现，并把证据链接自然嵌入叙事；随后逐产品研究细分用户、差异化叫卖点、营销链路、功能与痛点覆盖、真实用户验证、可学习之处和机会，最后回答固定14问。"
